# AmbiSense aspect lexicon (frozen).
#
# Each aspect has exactly two poles: `positive` and `negative`.
# Each pole has a short id, one NLI hypothesis, and seed terms.
#
# Hypotheses are short and past tense with an aspect subject ("The lighting was dim.").
# Review sentences rarely say "restaurant", and nli-deberta-v3-small scored clearly
# supporting sentences as neutral against "This restaurant is ..." hypotheses
# (sign accuracy 61/72 vs 72/72 on a hand-written probe set, 2026-10-19).
#
# Matching rules (see src/prep.py):
#   - case-insensitive, whole-word (no match inside a longer word: "cloud" != "loud")
#   - a space in a term also matches a hyphen or several spaces ("low key" == "low-key")
#   - curly apostrophes in text are normalized to straight ones before matching
#   - inflections are listed explicitly; there is no stemming
#
# `exclude` phrases are blanked out of a sentence before matching, so food or
# non-atmosphere uses of a seed term ("dim sum", "sea bass") do not match.

exclude:
  - dim sum
  - packed full of flavor
  - packed a punch
  - packs a punch
  - packed lunch
  - to go box was packed
  - well packed
  - packed up
  - packed with
  - packed onto
  - dead wrong
  - fresh squeezed
  - freshly squeezed
  - jazz up
  - jazz it up
  - jazz them up
  - hopping on
  - hopping off
  - bar hopping

aspects:
  noise:
    positive:
      id: quiet
      hypothesis: "The atmosphere was quiet."
      terms:
        - quiet
        - quieter
        - quietest
        - peaceful
        - tranquil
        - serene
        - hushed
        - can hear each other
        - could hear each other
        - able to hear each other
        - easy to have a conversation
        - easy to talk
        - good for conversation
        - not too loud
        - not too noisy
    negative:
      id: loud
      hypothesis: "The atmosphere was loud."
      terms:
